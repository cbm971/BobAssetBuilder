# BOB's leaderboard service (see README.md). `database_id` is the live D1 database on Blake's Cloudflare
# account (created 2026-11-28 by `npx wrangler d1 create bob-leaderboard`); local `wrangler dev` ignores it.
name = "bob-leaderboard"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "bob-leaderboard"
database_id = "a1039800-14d3-4f65-af55-f45da82e13b6"
