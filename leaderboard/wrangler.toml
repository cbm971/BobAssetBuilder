# BOB's leaderboard service (see README.md). `database_id` is filled in by the first deploy
# (`npx wrangler d1 create bob-leaderboard` prints it); local `wrangler dev` ignores it.
name = "bob-leaderboard"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "bob-leaderboard"
database_id = "00000000-0000-0000-0000-000000000000"
